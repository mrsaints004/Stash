name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  packages:
    name: Packages — Lint, Build, Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stash_test
          POSTGRES_PASSWORD: stash_test
          POSTGRES_DB: stash_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U stash_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://stash_test:stash_test@localhost:5432/stash_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @stash/common build && pnpm --filter @stash/abis build

      - name: Test packages
        run: pnpm --filter @stash/common test

      - name: Lint web
        run: pnpm --filter @stash/web lint

      - name: Build web
        run: pnpm --filter @stash/web build

      - name: Test api
        run: pnpm --filter @stash/api test

      - name: Lint api
        run: pnpm --filter @stash/api lint

  contracts:
    name: Contracts — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        working-directory: contracts
        run: forge build

      - name: Test
        working-directory: contracts
        run: forge test
